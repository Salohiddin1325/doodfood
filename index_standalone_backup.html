      const handleContactSubmit = (e) => {
        e.preventDefault();

        showToast(t.contact.feedbackSuccess);
        setTimeout(() => {
          setContactForm({ name: '', phone: '+998 ', message: '' });

      const handleOpenProductCustomizer = (product) => {
        setSelectedProductForCustomization(product);
        setCustomAddons([]);
      };

      const toggleAddon = (option) => {
        if (customAddons.some(a => a.id === option.id)) {
          setCustomAddons(customAddons.filter(a => a.id !== option.id));

          setCustomAddons([...customAddons, option]);

      const handleConfirmProductCustom = () => {

          document.documentElement.classList.add('dark');

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === product.id);
          if (existing) {
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        const nameStr = typeof product.name === 'object' ? (product.name[lang] || product.name.uz) : product.name;
        showToast(`${nameStr} ${lang === 'uz' ? "savatga qo'shildi!" : "добавлен в корзину!"}`);
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => {
          if (i.id === id) {
            const newQty = i.qty + delta;
            return newQty > 0 ? { ...i, qty: newQty } : null;

          return i;
        }).filter(Boolean));
      };

      const handleOpenComboCustomizer = (combo) => {

          main: combo.slots.main ? combo.slots.main.options[0] : null,
          side: combo.slots.side ? combo.slots.side.options[0] : null,
          drink: combo.slots.drink ? combo.slots.drink.options[0] : null,
        });
      };

      const calculateCustomComboTotal = () => {
        if (!selectedComboForCustom) return 0;
        const base = selectedComboForCustom.basePrice;
        const extraMain = selectedSlots.main?.extraPrice || 0;
        const extraSide = selectedSlots.side?.extraPrice || 0;
        const extraDrink = selectedSlots.drink?.extraPrice || 0;
        return base + extraMain + extraSide + extraDrink;
      };

      const handleConfirmCustomCombo = () => {
        if (!selectedComboForCustom) return;
        const finalPrice = calculateCustomComboTotal();
        const details = [];
        if (selectedSlots.main) details.push(selectedSlots.main.name[lang] || selectedSlots.main.name.uz);
        if (selectedSlots.side) details.push(selectedSlots.side.name[lang] || selectedSlots.side.name.uz);
        if (selectedSlots.drink) details.push(selectedSlots.drink.name[lang] || selectedSlots.drink.name.uz);

        const comboItem = {
          id: `${selectedComboForCustom.id}-custom-${Date.now()}`,
          name: selectedComboForCustom.name,
          price: finalPrice,
          image: selectedComboForCustom.image,
          isCombo: true,
          customNote: details.join(' • '),
        };
        addToCart(comboItem);
        setSelectedComboForCustom(null);
      };

      const handleQuickAddCombo = (combo) => {
        const item = {
          id: `${combo.id}-std`,
          name: combo.name,
          price: combo.basePrice,
          image: combo.image,
          isCombo: true,
          customNote: (combo.itemsSummary[lang] || combo.itemsSummary.uz).join(', ')
        };
        addToCart(item);
      };

      // Drink Customizer Helpers
      const handleOpenDrinkConfig = (drink) => {
        const currentSizeId = cardDrinkSizes[drink.id] || (drink.sizes ? drink.sizes[0].id : null);
        const initialSize = drink.sizes ? (drink.sizes.find(s => s.id === currentSizeId) || drink.sizes[0]) : null;
        setSelectedDrinkForConfig(drink);
        setSelectedDrinkSize(initialSize);
        setSelectedIce('regular');
        setSelectedSugar('regular');
      };

      const getDrinkPrice = (drink, size) => {
        if (size) return size.price;
        return drink.basePrice;
      };

      const handleAddConfiguredDrink = () => {
        if (!selectedDrinkForConfig) return;
        const price = getDrinkPrice(selectedDrinkForConfig, selectedDrinkSize);
        const tags = [];
        if (selectedDrinkSize) tags.push(selectedDrinkSize.id);
        if (selectedDrinkForConfig.supportsIce) {
          const iceNames = { none: t.drinks.iceNone, regular: t.drinks.iceRegular, extra: t.drinks.iceExtra };
          tags.push(iceNames[selectedIce]);
        }
        if (selectedDrinkForConfig.supportsSugar) {
          const sugarNames = { none: t.drinks.sugarNone, half: t.drinks.sugarHalf, regular: t.drinks.sugarRegular };
          tags.push(sugarNames[selectedSugar]);
        }

        const drinkItem = {
          id: `${selectedDrinkForConfig.id}-${selectedDrinkSize?.id || 'std'}-${Date.now()}`,
          name: selectedDrinkForConfig.name,
          price: price,
          image: selectedDrinkForConfig.image,
          isDrink: true,
          customNote: tags.join(' • ')
        };
        addToCart(drinkItem);
        setSelectedDrinkForConfig(null);

        const currentSizeId = cardDrinkSizes[drink.id] || (drink.sizes ? drink.sizes[0].id : null);

        const item = {
          id: `${drink.id}-${size?.id || 'std'}-${Date.now()}`,
          name: drink.name,
          price: size ? size.price : drink.basePrice,
          image: drink.image,
          isDrink: true,
          customNote: size ? size.label : (drink.volume || "450 ml")
        };

      const zoneData = {

      const deliveryFee = orderType === 'takeaway' ? 0 : (isFreeDelivery ? 0 : zoneData[deliveryZone].fee);

                  </div>
                  <div>
                    {lastOrderDetails?.orderType === 'takeaway' ? '🏢 Olib ketish (Takeaway)' : '🚲 Bektemir yetkazish'} • ~{lastOrderDetails?.time} daqiqa
                  </div>
                  <div className="text-[11px] text-slate-400">
                    To'lov: <span className="uppercase text-amber-500 font-bold">{lastOrderDetails?.paymentMethod}</span> • {lastOrderDetails?.total?.toLocaleString()} {t.menu.currency}
                  </div>
                </div>

                <button
                  onClick={() => setIsOrderSuccessOpen(false)}
                  className="w-full py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-black shadow-md transition-all active:scale-95"
                >
                  {t.checkout.backHome}
                </button>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl border border-amber-500/40 flex items-center gap-2 animate-bounce">
              <span>✓</span>
              <span>{toastMsg}</span>
            </div>
          )}

        </div>
      );
    }

    // Mount to root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DoodFoodApp />);
  </script>
</body>

</html>
